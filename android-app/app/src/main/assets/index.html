<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KJV App</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Georgia,serif;font-size:24px}header{position:sticky;top:0;background:#fff;border-bottom:2px solid #000;padding:14px;display:flex;gap:10px;align-items:center;z-index:2}button,select,input{font-size:20px;padding:10px;background:#fff;color:#000;border:2px solid #000;border-radius:4px}header button{min-width:54px}.grow{flex:1}#content{padding:18px 22px 100px}.verse{line-height:1.55;margin-bottom:8px}.vn{font:bold 16px sans-serif;vertical-align:super;margin-right:5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #000;display:flex;justify-content:space-between;padding:10px}.nav button{width:31%}.panel{display:none;padding:18px}.panel.show{display:block}.bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bookgrid button{font-size:18px;text-align:left}.chapgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.chapgrid button{text-align:center}.result{border-bottom:1px solid #777;padding:12px 2px;line-height:1.35}.small{font:18px sans-serif}h1{font-size:32px;margin:8px 0 18px}@media(max-width:700px){body{font-size:22px}}
</style></head><body><header><button onclick="showBooks()">☰</button><b class="grow" id="title">KJV Bible</b><button onclick="showSearch()">⌕</button></header><main id="content"></main><section id="books" class="panel"><h1>Books</h1><div id="bookgrid" class="bookgrid"></div></section><section id="chapters" class="panel"><h1 id="chapTitle">Chapters</h1><div id="chapgrid" class="chapgrid"></div></section><section id="search" class="panel"><h1>Search the KJV</h1><div style="display:flex;gap:8px"><input id="q" class="grow" placeholder="word or phrase"><button onclick="searchBible()">Search</button></div><p class="small" id="status"></p><div id="results"></div></section><nav id="nav" class="nav"><button onclick="prev()">‹ Previous</button><button onclick="showChapters()">Chapters</button><button onclick="next()">Next ›</button></nav><script>
const B=[['Genesis','genesis'],['Exodus','exodus'],['Leviticus','leviticus'],['Numbers','numbers'],['Deuteronomy','deuteronomy'],['Joshua','joshua'],['Judges','judges'],['Ruth','ruth'],['1 Samuel','1_samuel'],['2 Samuel','2_samuel'],['1 Kings','1_kings'],['2 Kings','2_kings'],['1 Chronicles','1_chronicles'],['2 Chronicles','2_chronicles'],['Ezra','ezra'],['Nehemiah','nehemiah'],['Esther','esther'],['Job','job'],['Psalms','psalms'],['Proverbs','proverbs'],['Ecclesiastes','ecclesiastes'],['Song of Solomon','song_of_solomon'],['Isaiah','isaiah'],['Jeremiah','jeremiah'],['Lamentations','lamentations'],['Ezekiel','ezekiel'],['Daniel','daniel'],['Hosea','hosea'],['Joel','joel'],['Amos','amos'],['Obadiah','obadiah'],['Jonah','jonah'],['Micah','micah'],['Nahum','nahum'],['Habakkuk','habakkuk'],['Zephaniah','zephaniah'],['Haggai','haggai'],['Zechariah','zechariah'],['Malachi','malachi'],['Matthew','matthew'],['Mark','mark'],['Luke','luke'],['John','john'],['Acts','acts'],['Romans','romans'],['1 Corinthians','1_corinthians'],['2 Corinthians','2_corinthians'],['Galatians','galatians'],['Ephesians','ephesians'],['Philippians','philippians'],['Colossians','colossians'],['1 Thessalonians','1_thessalonians'],['2 Thessalonians','2_thessalonians'],['1 Timothy','1_timothy'],['2 Timothy','2_timothy'],['Titus','titus'],['Philemon','philemon'],['Hebrews','hebrews'],['James','james'],['1 Peter','1_peter'],['2 Peter','2_peter'],['1 John','1_john'],['2 John','2_john'],['3 John','3_john'],['Jude','jude'],['Revelation','revelation']];
let bi=+localStorage.bi||42,ch=+localStorage.ch||3,cache={};const $=x=>document.getElementById(x);function hide(){['content','books','chapters','search'].forEach(x=>{$(x).style.display='none';$(x).classList.remove('show')});$('nav').style.display='none'}async function load(i){if(cache[i])return cache[i];let r=await fetch('books/'+B[i][1]+'.json');return cache[i]=await r.json()}async function read(i=bi,c=ch,verse=0){bi=i;ch=c;localStorage.bi=bi;localStorage.ch=ch;hide();$('content').style.display='block';$('nav').style.display='flex';let d=await load(bi),vs=d.chapters[String(ch)];$('title').textContent=B[bi][0]+' '+ch;$('content').innerHTML='<h1>'+B[bi][0]+' '+ch+'</h1>'+Object.keys(vs).map(v=>'<div class="verse" id="v'+v+'"><span class="vn">'+v+'</span>'+vs[v].replace(/[{}]/g,'')+'</div>').join('');if(verse)setTimeout(()=>$('v'+verse)?.scrollIntoView(),80);else scrollTo(0,0)}function showBooks(){hide();$('books').classList.add('show');$('books').style.display='block';$('bookgrid').innerHTML=B.map((b,i)=>'<button onclick="pickBook('+i+')">'+b[0]+'</button>').join('');scrollTo(0,0)}async function pickBook(i){bi=i;ch=1;showChapters()}async function showChapters(){hide();$('chapters').classList.add('show');$('chapters').style.display='block';let d=await load(bi),n=Object.keys(d.chapters).length;$('chapTitle').textContent=B[bi][0]+' — Chapters';$('chapgrid').innerHTML=Array.from({length:n},(_,x)=>'<button onclick="read('+bi+','+(x+1)+')">'+(x+1)+'</button>').join('');scrollTo(0,0)}async function prev(){if(ch>1)return read(bi,ch-1);if(bi>0){let d=await load(bi-1);read(bi-1,Object.keys(d.chapters).length)}}async function next(){let d=await load(bi),n=Object.keys(d.chapters).length;if(ch<n)return read(bi,ch+1);if(bi<B.length-1)read(bi+1,1)}function showSearch(){hide();$('search').classList.add('show');$('search').style.display='block';$('q').focus()}async function searchBible(){let q=$('q').value.trim().toLowerCase();if(!q)return;$('results').innerHTML='';$('status').textContent='Searching entire Bible…';let out=[];for(let i=0;i<B.length;i++){let d=await load(i);for(let c of Object.keys(d.chapters))for(let v of Object.keys(d.chapters[c])){let t=d.chapters[c][v].replace(/[{}\[\]]/g,'');let hit=q.includes(' ')?t.toLowerCase().includes(q):new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(t);if(hit)out.push([i,+c,+v,t])}}$('status').textContent=out.length+' result'+(out.length==1?'':'s');$('results').innerHTML=out.slice(0,500).map(r=>'<div class="result" onclick="read('+r[0]+','+r[1]+','+r[2]+')"><b>'+B[r[0]][0]+' '+r[1]+':'+r[2]+'</b><br>'+r[3]+'</div>').join('')+(out.length>500?'<p>First 500 results shown.</p>':'')}
read();
</script></body></html>
