name: Build KJV Android App
on:
  push:
    branches: [kjv-android-app]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle complete KJV locally
        run: |
          git clone --depth 1 https://github.com/nolanbaxter/kjv-bible.git /tmp/kjv
          mkdir -p android-app/app/src/main/assets/books
          cp /tmp/kjv/*.json android-app/app/src/main/assets/books/
          test $(find android-app/app/src/main/assets/books -name '*.json' | wc -l) -ge 66
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Name APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk KJV-App-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KJV-App-v0.1.0
          path: KJV-App-v0.1.0.apk
